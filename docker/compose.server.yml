# 基础设施 + 应用合并：postgres、redis 定义保持不变，已运行的容器不会被重建。
# 用法（仓库根目录）：docker compose -f docker/compose.server.yml --env-file docker/.env up -d --build api web
name: yanyun-infrastructure

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-yanyun}
      POSTGRES_USER: ${POSTGRES_USER:-yanyun}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请设置 POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?请设置 REDIS_PASSWORD}
    command:
      - sh
      - -c
      - 'exec redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy noeviction --requirepass "$${REDIS_PASSWORD}"'
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", 'REDISCLI_AUTH="$${REDIS_PASSWORD}" redis-cli ping | grep -q PONG']
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: docker/api.Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      AllowedHosts: ${PUBLIC_HOST:?请填写 PUBLIC_HOST，例如 yy.example.com}
      ConnectionStrings__Postgres: Host=postgres;Database=${APP_DB_NAME:-yanyun_prod};Username=${POSTGRES_USER:-yanyun};Password=${POSTGRES_PASSWORD};Timeout=3;Command Timeout=5
      ConnectionStrings__Redis: redis:6379,password=${REDIS_PASSWORD}
      Auth__SigningKey: ${JWT_SIGNING_KEY:?请填写 JWT_SIGNING_KEY（至少 32 字节随机值）}
      Email__ResendApiKey: ${RESEND_API_KEY:?请填写 RESEND_API_KEY}
      Email__From: ${EMAIL_FROM:?请填写 EMAIL_FROM}
      Cors__AllowedOrigins__0: ${PUBLIC_ORIGIN:?请填写 PUBLIC_ORIGIN，例如 https://yy.example.com}
      # 与本机开发共用同一个 Redis 时，前缀必须不同。
      Redis__KeyPrefix: ${REDIS_KEY_PREFIX:-yanyun:prod:}
      DataProtection__KeysPath: /app/keys
      # 宿主机上的 Caddy 经 Docker 网关访问 API，需信任该网关地址的 X-Forwarded-*（取值见 doc/08-部署说明.md）。
      Proxy__KnownProxies__0: ${PROXY_IP:?请填写 PROXY_IP（compose 网络网关地址）}
    ports:
      - "127.0.0.1:5080:8080"
    volumes:
      # 持久化 Data Protection 密钥：邀请码加密、CSRF Cookie 都依赖它。
      - data-protection:/app/keys

  web:
    build:
      context: ..
      dockerfile: docker/web.Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  postgres-data:
  redis-data:
  data-protection:
